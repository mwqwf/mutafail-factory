name: تحديد مفتاح جيميناي ذي الرصيد

# أمر المالك 2026-10-14: أحدث نموذج صوت (غير الخفيف) لا تراه إلا المفاتيح المدفوعة ⇒ نداءات قائمةٍ مجّانية،
# ثمّ توليدةٌ واحدةٌ قصيرة جداً بالمفتاح الذي يراه حتى أوّل نجاح. المقطع أثرٌ يُحذف بعد يوم.
on:
  push:
    paths: ["ops/probe/paid_key.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: الفحص
        env:
          GEMINI_KEYS_JSON: ${{ secrets.GEMINI_KEYS_JSON }}
          GEMINI_PAID_KEY: ${{ secrets.GEMINI_PAID_KEY }}
        run: |
          set -euo pipefail
          # ⚠️ المفتاح المدفوع (سرّ GEMINI_PAID_KEY، أمر المالك 2026-10-15) يُفحص وحده إن ضُبط: كلّ نداءٍ به يُحاسَب
          if [ -n "$GEMINI_PAID_KEY" ]; then echo "⚠️ المفتاح المدفوع وحده (GEMINI_PAID_KEY)"; printf '%s' "$GEMINI_PAID_KEY" > /tmp/keys.json
          else printf '%s' "$GEMINI_KEYS_JSON" > /tmp/keys.json; fi
          node tools/paid_key_probe.js --keys /tmp/keys.json --tts "$(python3 -c "import json;print(','.join(json.load(open('ops/probe/paid_key.json')).get('tts',[])))")"
          rm -f /tmp/keys.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: paid-sample, path: out/, retention-days: 1, if-no-files-found: ignore }
