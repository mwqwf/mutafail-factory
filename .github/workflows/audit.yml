name: مصنع المتفائل — تشريحُ الشوط بعد النشر

run-name: 🔍 تشريحُ ${{ github.event.workflow_run.display_title }}

# ⭐ **لماذا:** أمرُ المالك 2026-09-14: «بعد أن يكمل صناعة كلّ فيديو وينشره
#    نهائيًّا، تفقّد ما فعله وما واجهه وأصلِحه كي لا يتكرّر».
#    فالذاكرةُ لا تُترك للسجلّ وحده: كلُّ شوطِ إنتاجٍ أو إتمامٍ — نجح أو سقط —
#    يُكتب تشريحُه في `ops/state/postmortem/<الشوط>.md` بخطواته ومؤشّراته،
#    ويُدفع إلى المستودع. فيجد الدماغُ في دورته أثراً **مقروءاً بلا تنزيل سجلّات**.
on:
  workflow_run:
    workflows:
      - "مصنع المتفائل — إنتاج حلقة"
      - "مصنع المتفائل — إتمامُ نشرٍ ناقص"
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: mutafail-audit
  cancel-in-progress: false

jobs:
  audit:
    # Owner financial stop 2026-09-18: no runner allocation until verified free.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }

      - name: اجمع خطواتِ الشوط ومؤشّراتِه
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.event.workflow_run.id }}
          CONCL: ${{ github.event.workflow_run.conclusion }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -u
          mkdir -p ops/state/postmortem
          OUT="ops/state/postmortem/${RUN}.md"

          {
            echo "# 🔍 تشريحُ الشوط ${RUN} — $(date -u +%FT%TZ)"
            echo "- العنوان: ${TITLE}"
            echo "- الخلاصة: **${CONCL}**"
            echo "- الرابط: ${URL}"
            echo
            echo "## الوظائفُ والخطوات"
          } > "$OUT"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/jobs?per_page=100" \
            --jq '.jobs[] | "\n### \(.name) — \(.conclusion)\n" +
                  ([.steps[]? | "- \(.conclusion == "success" | if . then "✅" else "⛔" end) \(.name)"] | join("\n"))' \
            >> "$OUT" || echo "⚠️ تعذّرت قراءةُ الوظائف" >> "$OUT"

          # ⛔ المؤشّراتُ لا تُستنبط من الظنّ — تُلتقط من السجلّ بنصّها
          gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --log > /tmp/run.log 2>/dev/null || true
          {
            echo
            echo "## المؤشّراتُ الملتقَطة (بنصّها من السجلّ)"
            if [ -s /tmp/run.log ]; then
              # ⛔⛔ درسٌ مقيسٌ 2026-09-15 (شوط amal-1): `listen.js` يطبع **أسبابَ**
              #    عدم الفحص مُحصاةً تحت عنوان «أسبابُ عدم الفحص:» — وهي الإصلاحُ
              #    الذي وُضع في 09-14 لأنّ العددَ وحدَه لا يُفيد الدماغَ شيئاً.
              #    لكنّ هذا الالتقاطَ كان يأخذ سطورَ ⚠️ وحدَها، فيلتقط «١٩٩ كتلةً لم
              #    تُفحص» **ويُسقط سببَها**. فبقي السؤالُ بلا جواب: أنفدت الحصّة؟
              #    أم النموذجُ مفقود؟ ⇒ تُلتقط سطورُ الأسباب (وهي «‏  عدد × سبب»)
              #    وسطورُ الرايات «⚑» كذلك، فلا يضيع ما طُبع فعلاً.
              # ⛔⛔⛔ وعطبٌ أعمقُ كُشف في الدورة نفسِها: كان النمطُ ينتهي بـ`[^\r]*`
              #    قصداً لاستبعاد محرف العودة. **وهذا في grep -E ليس كذلك**: داخل
              #    قوسَي المجموعة `[^\r]` تعني «ليس باءً مائلةً ولا حرفَ r» — فكلُّ
              #    مؤشّرٍ كان **يُبتر عند أوّل حرف r**. والدليلُ في تشريح اليوم نفسِه:
              #    «✅ رُفع: m2wEE» — والمعرّفُ m2wEErDQmvo، بُتر عند الـr بالضبط.
              #    فالتشريحُ كان يكذب صامتاً منذ وُضع، ويُخفي المعرّفاتِ والأسباب.
              # ⇒ يُنزع محرفُ العودة بـ`tr` أوّلاً، ثمّ يُؤخذ بقيّةُ السطر بـ`.*`
              #   (و`grep` سطريٌّ فلا تعبر النقطةُ إلى سطرٍ آخر).
              tr -d '\r' < /tmp/run.log \
                | grep -aoE '(⛔|⚠️|↻|⚑|أسبابُ عدم الفحص|مفحوص:|[0-9]+ × |✅ رُفع:|✅ أُضيف|✅ المصغّرة|فرقُ البكسلات).*' \
                | sed 's/^/- /' | sort -u | head -60
              echo
              echo "### أسطرُ الخطأ الصريحة"
              grep -aoE '##\[error\][^\r]*' /tmp/run.log | sed 's/^/- /' | sort -u | head -20
              echo
              echo "### الحصّةُ والرفعات"
              printf -- "- رفعاتٌ في هذا الشوط: %s\n" "$(grep -ac '✅ رُفع:' /tmp/run.log || echo 0)"
              printf -- "- استئنافاتٌ (لم يُرفع مرّتين): %s\n" "$(grep -ac '↻ ' /tmp/run.log || echo 0)"
            else
              echo "- ⚠️ سجلُّ الشوط غيرُ متاح (قد يكون حُذف أو الشوطُ ملغًى)"
            fi
            echo
            echo "## المطلوبُ من الدماغ"
            if [ "$CONCL" = "success" ]; then
              echo "- اقرأ المؤشّراتِ أعلاه: كلُّ ⚠️ أو ↻ **سببٌ لم يُصلَح بعد** وإن نجح الشوط."
            else
              echo "- ⛔ الشوطُ لم ينجح: أصلِح السببَ في الشيفرة لا في الشوط، ثمّ أعِد الدفع."
            fi
            echo "- وحين يُعالَج سببٌ، انقل سطرَه إلى \`ops/state/journal.md\` واشطبه من هنا."
          } >> "$OUT"

          echo "── التشريح ──"; cat "$OUT"

      - name: ادفعِ التشريحَ إلى المستودع
        if: always()
        run: |
          git config user.name  "مشرِّحُ الأشواط"
          git config user.email "audit@mutafail.local"
          git add -A ops/state/postmortem
          git commit -qm "🔍 تشريحُ الشوط ${{ github.event.workflow_run.id }} (${{ github.event.workflow_run.conclusion }})" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase -q origin master && git push -q origin HEAD:master && exit 0
            sleep $(( i * 2 ))
          done
          echo "⛔ تعذّر دفعُ التشريح"; exit 1
