name: مصنع المتفائل — نشرُ حمولةٍ مختومةٍ من إصدار

run-name: 📤 نشرُ ${{ inputs.release_tag || github.event.head_commit.message }}

# ⭐ لماذا (2026-09-27 · اليرموك): الفيلم صُنع على جهاز المالك لا في شوط film.yml،
#    ورفعُ 500م.ب عبر كروم مستحيل (حدّ file_upload عشرة م.ب)، وسرُّ يوتيوب لا يكون إلا هنا.
#    ⇒ تُختم الحمولة محلّياً بـtools/seal.sh (مفتاحٌ عامّ)، وتُرفع أجزاءً إلى **إصدارٍ مسوّدة**
#      (لا يراه إلا صاحب المستودع، ومحتواه مشفّر أصلاً)، ثم يفكّها هذا الشوط وينشر.
# المستودعُ عامّ ⇒ العدّاءات القياسية مجانية؛ ولا تشغيل إلا يدويّاً.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "وسمُ الإصدار المسوّدة الذي يحمل الأجزاء (part_*) وkey.enc وSHA256SUMS"
        required: true
        type: string
  # ⭐ زنادٌ للجلسة السحابية (لا تملك workflow_dispatch): دفعُ ops/publish/<slug>.json = {"release_tag":"<slug>-payload"}
  push:
    paths: ["ops/publish/**"]

permissions:
  contents: write

concurrency:
  group: mutafail-sealed-publish
  cancel-in-progress: false

jobs:
  # ⭐ بوّابة (أمر المالك 2026-10-01): الدفعُ يُطلق النشر فقط إن حمل إيداعُه الأخيرُ ملفاً في ops/publish/؛
  #    فدفعُ فرعٍ جديدٍ أو دمجٌ يحمل ملفاتٍ قديمة لا ينشر شيئاً ولا يفشل.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: g
        env:
          EV: ${{ github.event_name }}
        run: |
          if [ "$EV" = workflow_dispatch ] || git show --pretty= --name-only "$GITHUB_SHA" | grep -q '^ops/publish/.*\.json$'; then
            echo go=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::لا ملفَّ نشرٍ في هذا الإيداع — لا نشر"; echo go=false >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: 🔑 تفويض يوتيوب (المجدَّد المختوم أوّلاً)
        uses: ./.github/actions/yt-oauth
        with:
          private_key: ${{ secrets.CONTENT_PRIVATE_KEY }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
      - name: وسمُ الإصدار
        env:
          IN_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          T="$IN_TAG"
          if [ -z "$T" ]; then
            F=$(git show --pretty= --name-only "$GITHUB_SHA" | grep '^ops/publish/.*\.json$' | head -1)
            T=$(python3 -c "import json,sys,re;t=json.load(open(sys.argv[1],encoding='utf-8'))['release_tag'];assert re.fullmatch(r'[a-z0-9-]+',t);print(t)" "$F")
          fi
          echo "TAG=$T" >> "$GITHUB_ENV"
          # موعدُ العرض (اختياريّ): {"publish_at":"now","reel_offsets":"0,30,60"} ⇒ الفيلم فوراً والريلزات على مواعيدها
          F=$(git show --pretty= --name-only "$GITHUB_SHA" | grep '^ops/publish/.*\.json$' | head -1 || true)
          if [ -n "$F" ]; then
            python3 - "$F" >> "$GITHUB_ENV" <<'PY'
          import json, re, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          at = d.get('publish_at', '')
          if at:
              assert at == 'now' or re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', at); print('PUBLISH_AT=' + at)
          off = d.get('reel_offsets', '')
          if off:
              assert off == 'now' or re.fullmatch(r'\d+(,\d+)*', off); print('REEL_OFFSETS=' + off)
          PY
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q google-auth google-auth-oauthlib google-api-python-client
      # ffprobe لحارس الريلز reel_shape (عين جالوت 2026-09-29: سقط الرفع بعد الفيلم لغيابه عن العدّاء)
      - run: command -v ffprobe || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }

      - name: جلبُ الأجزاء والتحقّق من بصماتها
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sealed && cd sealed
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --clobber
          sed -i 's/ \*/  /' SHA256SUMS
          sha256sum -c SHA256SUMS
          cat part_* > payload.enc && rm part_*

      - name: فضُّ الختم
        env:
          CONTENT_PRIVATE_KEY: ${{ secrets.CONTENT_PRIVATE_KEY }}
        run: bash tools/unseal.sh sealed "$PWD/proj" && rm -rf sealed && ls -la proj proj/reels

      - name: ⛔ إن غاب سرُّ النشر فلا شوطَ كاذب
        env:
          YT_OAUTH_JSON: ${{ env.YT_OAUTH_SEALED_JSON || secrets.YT_OAUTH_JSON }}
        run: '[ -n "$YT_OAUTH_JSON" ] || { echo "⛔⛔ سرُّ YT_OAUTH_JSON غيرُ مضبوط"; exit 1; }'

      # ⛔ درس عين جالوت 2026-09-29: الحالةُ الحقّة على master (يكتبها «تسجيلُ الحالة»)، لا على الفرع.
      #    قرأ الشوطُ حالةَ الفرع القديمة فلم يعرف ريلزاً نُشر ثم حذفه المالك، فأعاد رفعه.
      #    ⇒ ما سجّلته الحالة منشوراً لا يُرفع ثانيةً ولو غاب عن القناة.
      - name: حالةُ النشر من master
        run: git fetch -q origin master && git checkout origin/master -- ops/state/ && cat ops/state/last_publish.json 2>/dev/null | head -40 || true

      # ⭐ بوّابة الافتتاحية قبل النشر (خطّة مؤتة §١٢، وحكم المالك 2026-10-05 بإلغاء طقوس الافتتاحية القديمة دائماً):
      #    يشاهد جيميناي أوّل أربع دقائق من الفيلم النهائيّ بمعيار تشريح الافتتاحيات (tools/opening_gate.py).
      #    القصّة دون ثلث أوّل 150 ث، أو منهجٌ أو طلبٌ أو تعريفٌ بالقناة قبل الدقيقة الرابعة، أو تحيّةٌ في الافتتاح البارد ⇒ لا نشر.
      #    والتعذّر (حصّةٌ أو خطأ) ليس نجاحاً. ولا بوّابة لحمولة ريلزاتٍ وحدها ولا لاستئنافٍ رُفع فيلمه سلفاً.
      #    والتقرير في العدّاء وحده (فيه تفريغ ما لم يُنشر)، والسجلّ أرقامٌ وأسباب.
      - name: بوّابة الافتتاحية
        env:
          GEMINI_KEYS_JSON: ${{ secrets.GEMINI_KEYS_JSON }}
        run: |
          printf '%s' "$GEMINI_KEYS_JSON" > /tmp/keys.json
          rc=0; python tools/opening_gate.py proj --keys /tmp/keys.json --out /tmp/opening_gate.json || rc=$?
          rm -f /tmp/keys.json /tmp/opening_gate.json proj/*.gate.mp4
          exit $rc

      - name: النشر (الفيلم ثم المصغّرة ثم القائمة ثم الريلزان)
        env:
          YT_OAUTH_JSON: ${{ env.YT_OAUTH_SEALED_JSON || secrets.YT_OAUTH_JSON }}
        run: python tools/publish_youtube.py proj

      - name: تصحيحُ عناوين منشورة ("retitle" في ops/publish/<slug>.json)
        env:
          YT_OAUTH_JSON: ${{ env.YT_OAUTH_SEALED_JSON || secrets.YT_OAUTH_JSON }}
        run: |
          F=$(git show --pretty= --name-only "$GITHUB_SHA" | grep '^ops/publish/.*\.json$' | head -1 || true)
          if [ -n "$F" ]; then python tools/retitle.py "$F"; else echo "لا عناوين للتصحيح"; fi

      - name: مصغّراتُ أفلامٍ منشورة (ops/thumbs_pending/<videoId>.jpg)
        if: always()
        env:
          YT_OAUTH_JSON: ${{ env.YT_OAUTH_SEALED_JSON || secrets.YT_OAUTH_JSON }}
        run: |
          ls ops/thumbs_pending/*.jpg >/dev/null 2>&1 || { echo "لا مصغّرات معلّقة"; exit 0; }
          python tools/set_thumbs.py

      - name: تسجيلُ الحالة
        if: always()
        run: |
          git config user.name  "مصنع المتفائل"
          git config user.email "factory@mutafail.local"
          [ -n "$(git status --porcelain ops/state ops/thumbs_pending)" ] || { echo "لا جديد"; exit 0; }
          rm -rf /tmp/state_keep /tmp/thumbs_keep && mkdir -p /tmp/state_keep /tmp/thumbs_keep && cp -a ops/state/. /tmp/state_keep/
          ls ops/thumbs_pending/ > /tmp/thumbs_keep/left.txt 2>/dev/null || true
          for i in 1 2 3 4; do
            if git fetch -q origin master && git reset -q --hard origin/master; then
              cp -a /tmp/state_keep/. ops/state/
              for f in ops/thumbs_pending/*.jpg; do [ -e "$f" ] || continue; grep -qx "$(basename "$f")" /tmp/thumbs_keep/left.txt || git rm -q "$f"; done
              git add -A ops/state
              if git diff --cached --quiet; then echo "لا جديد"; exit 0; fi
              git commit -qm "📤 نُشرت حمولة ${{ env.TAG }}" && git push -q origin HEAD:master && exit 0
            fi
            sleep $(( i * 3 ))
          done
          echo "⛔ تعذّر دفعُ الحالة"; exit 1
