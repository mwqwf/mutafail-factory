name: مصنع المتفائل — تعديلاتُ ما بعد النشر

run-name: 🛠️ ${{ github.event.head_commit.message }}

# ⭐ **لماذا:** بعضُ ما يطلبه المالك يقع **بعد** الرفع: نشرٌ عامٌّ فوريّ بدل الجدولة،
#    أو سطرٌ يُضاف إلى الوصف، أو إضافةُ الفيلم إلى قائمةٍ ثانية.
#    والجلسةُ السحابيّة لا تملك سرَّ يوتيوب، فيُنفَّذ الأمرُ هنا حيث السرّ.
# الزناد: دفعُ ملفِّ أمرٍ في `ops/admin/`.
on:
  push:
    paths: ["ops/admin/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutafail-admin
  cancel-in-progress: false

jobs:
  admin:
    # Owner financial stop 2026-09-18: no runner allocation until verified free.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q google-auth google-auth-oauthlib google-api-python-client
      - name: نفّذ أوامرَ هذه الدفعة
        env:
          YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
        run: |
          [ -n "$YT_OAUTH_JSON" ] || { echo "⛔ سرُّ YT_OAUTH_JSON غيرُ مضبوط"; exit 1; }
          # ⛔ تُنفَّذ أوامرُ هذه الدفعة وحدَها، لا كلُّ ما في المجلّد (فلا يُعاد القديم)
          FILES=$(git show --pretty= --name-only ${{ github.sha }} | grep '^ops/admin/.*\.json$' || true)
          [ -n "$FILES" ] || { echo "لا أمرَ في هذه الدفعة"; exit 0; }
          for f in $FILES; do
            echo "── $f ──"
            python tools/video_admin.py "$f"
          done
