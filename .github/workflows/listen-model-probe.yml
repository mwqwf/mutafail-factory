name: مصنع المتفائل — مسبار نموذج الفحص

on:
  schedule:
    - cron: "8 6 17 9 *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: mutafail-listen-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: حارس المسبار الوحيد
        run: |
          [ "$(date -u +%F)" = 2026-09-17 ] || { echo "انتهت نافذة المسبار"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: ./.github/actions/private-download
        with:
          name: proj
          path: proj
          run-id: 35130379820
          github-token: ${{ secrets.GITHUB_TOKEN }}
          private-key: '${{ secrets.CONTENT_PRIVATE_KEY }}'
      - uses: ./.github/actions/private-download
        with:
          pattern: audio-*
          path: proj/audio
          run-id: 35130379820
          github-token: ${{ secrets.GITHUB_TOKEN }}
          private-key: '${{ secrets.CONTENT_PRIVATE_KEY }}'
      - uses: ./.github/actions/private-download
        with:
          pattern: listen-*
          path: proj
          run-id: 35130379820
          github-token: ${{ secrets.GITHUB_TOKEN }}
          private-key: '${{ secrets.CONTENT_PRIVATE_KEY }}'
      - name: اختر راية محفوظة للمقارنة بلا طباعة النص
        run: |
          python3 - <<'PY'
          import glob,json,os,shutil
          blocks={b['id']:b for b in json.load(open('proj/blocks.json',encoding='utf-8'))}
          old={}
          for f in glob.glob('proj/listen_results*.json'):
              old.update(json.load(open(f,encoding='utf-8')))
          ids=[k for k,v in old.items() if isinstance(v,dict) and v.get('ok') is False and k in blocks]
          if not ids: raise SystemExit('لا راية محفوظة للمقارنة')
          ident=sorted(ids)[0]
          os.makedirs('probe/audio',exist_ok=True)
          json.dump([blocks[ident]],open('probe/blocks.json','w',encoding='utf-8'),ensure_ascii=False)
          shutil.copy2('proj/audio/'+ident+'.wav','probe/audio/'+ident+'.wav')
          json.dump({'id':ident,'ok':old[ident]['ok']},open('probe/baseline.json','w',encoding='utf-8'))
          PY
      - name: جرّب gemini-2.5-flash على مقطع واحد
        env:
          GEMINI_KEYS_JSON: ${{ secrets.GEMINI_KEYS_JSON }}
        run: |
          set -euo pipefail
          [ -n "$GEMINI_KEYS_JSON" ] || { echo "لا سر فحص"; exit 1; }
          printf '%s' "$GEMINI_KEYS_JSON" > keys.json
          code=0
          node tools/listen.js probe 1 --batch 1 --model gemini-2.5-flash --keys keys.json >/tmp/probe.log 2>&1 || code=$?
          rm -f keys.json /tmp/probe.log
          python3 - "$code" <<'PY'
          import json,sys
          base=json.load(open('probe/baseline.json',encoding='utf-8'))
          try: row=json.load(open('probe/listen_results.json',encoding='utf-8'))[base['id']]
          except Exception: raise SystemExit('⛔ المسبار لم ينتج نتيجة منظّمة')
          if type(row.get('ok')) is not bool: raise SystemExit('⛔ لا حكم منطقي من النموذج البديل')
          if not row.get('input_sha256'): raise SystemExit('⛔ النتيجة بلا بصمة')
          print('✅ المسبار: نتيجة منظّمة ذات بصمة؛ الاتفاق مع الفحص السابق:', row['ok']==base['ok'])
          if int(sys.argv[1]) != 0: raise SystemExit('⛔ أداة الفحص أنهت بفشل')
          PY
      - uses: ./.github/actions/private-upload
        if: always()
        with:
          name: listen-model-probe
          path: probe
          retention-days: 7
