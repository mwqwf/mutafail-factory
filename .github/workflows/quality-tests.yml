name: اختبارات حراس الجودة والاستئناف
on:
  push:
    paths: ["tools/listen*", "tools/image_sources.py", "tools/test_*.py", "tools/test_*.js", ".github/workflows/quality-tests.yml"]
  pull_request:
    paths: ["tools/listen*", "tools/image_sources.py", "tools/test_*.py", "tools/test_*.js"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install pillow
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: node tools/test_listen_cache.js
      - run: node --check tools/listen.js
