name: إحصاءات القناة — أضعف الريلزات بالأرقام

run-name: 📊 ${{ github.event.head_commit.message || 'تشغيلٌ يدويّ' }}

# أمر المالك 2026-10-04: «إذا كان يوتيوب يتيح معرفة ذلك اعرف لنا أضعف الريلزات الأخرى وأضفها للطابور لكي يستبدلها كوديكس».
# دفعُ ملفّ أمرٍ صغيرٍ في ops/stats/*.json (أو التشغيل اليدويّ) يشغّل tools/channel_stats.py بتفويض يوتيوب،
# فيقرأ مشاهدات كلّ فيديوٍ عامٍّ وإعجاباته وتعليقاته، ونسبةَ المشاهدة إن أتاحها التفويض، ويرتّب الريلزات من الأضعف.
# ⛔ المستودع عامّ والتحليلات خاصّة ⇒ لا يُودَع التقرير في git، بل يُرفع إلى إصدارٍ مسوّد خاصّ باسم channel-stats.
# الكلفة: العدّاء القياسيّ مجّانيّ في المستودع العامّ، ومن حصّة يوتيوب بضعُ وحداتٍ لا تمسّ النشر.
on:
  push:
    paths: ["ops/stats/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: المكتبات
        run: pip install -q google-auth google-auth-oauthlib google-api-python-client
      - name: قراءة القناة وترتيب الريلزات
        env:
          YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python tools/channel_stats.py out/channel_stats.json
          test -s out/channel_stats.json
      - name: رفع التقرير إلى الإصدار المسوّد الخاصّ
        run: |
          set -euo pipefail
          gh release view channel-stats >/dev/null 2>&1 || gh release create channel-stats --draft --title "إحصاءات القناة — خاصّ" --notes "تقرير tools/channel_stats.py: مشاهدات الفيديوهات العامّة ونسبة المشاهدة وترتيب الريلزات من الأضعف. خاصٌّ: لا يُودَع في المستودع العامّ."
          gh release upload channel-stats out/channel_stats.json --clobber
          echo "✅ رُفع التقرير إلى الإصدار المسوّد channel-stats"
