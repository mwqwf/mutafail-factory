name: إحصاءات القناة — أضعف الريلزات بالأرقام

run-name: 📊 ${{ github.event.head_commit.message || 'تشغيلٌ يدويّ' }}

# أمر المالك 2026-10-04: «إذا كان يوتيوب يتيح معرفة ذلك اعرف لنا أضعف الريلزات الأخرى وأضفها للطابور لكي يستبدلها كوديكس».
# دفعُ ملفّ أمرٍ صغيرٍ في ops/stats/*.json (أو التشغيل اليدويّ) يشغّل tools/channel_stats.py بتفويض يوتيوب،
# فيقرأ مشاهدات كلّ فيديوٍ عامٍّ وإعجاباته وتعليقاته، ونسبةَ المشاهدة إن أتاحها التفويض، ويرتّب الريلزات من الأضعف.
# ⛔ المستودع عامّ والتحليلات خاصّة ⇒ لا يُودَع التقرير في git، بل يُرفع إلى إصدارٍ مسوّد خاصّ باسم channel-stats.
# الكلفة: العدّاء القياسيّ مجّانيّ في المستودع العامّ، ومن حصّة يوتيوب بضعُ وحداتٍ لا تمسّ النشر.
on:
  push:
    paths: ["ops/stats/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: channel-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: المكتبات
        run: pip install -q google-auth google-auth-oauthlib google-api-python-client
      - name: قراءة القناة وترتيب الريلزات
        env:
          YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python tools/channel_stats.py out/channel_stats.json
          test -s out/channel_stats.json
      - name: رفع التقرير إلى الإصدار المسوّد الخاصّ
        run: |
          set -euo pipefail
          gh release view channel-stats >/dev/null 2>&1 || gh release create channel-stats --draft --title "إحصاءات القناة — خاصّ" --notes "تقرير tools/channel_stats.py: مشاهدات الفيديوهات العامّة ونسبة المشاهدة وترتيب الريلزات من الأضعف. خاصٌّ: لا يُودَع في المستودع العامّ."
          gh release upload channel-stats out/channel_stats.json --clobber
          echo "✅ رُفع التقرير إلى الإصدار المسوّد channel-stats"
      # ⭐ الطلب الخارجيّ المقيس (طلب المالك 2026-10-05: «بحثٌ حقيقيّ جادّ… وأهمّ هدفٍ الاحتفاظ بالمشاهد»)،
      #    وتحليل المنافسين (سؤاله: «لماذا قنواتٌ أقلّ جودةً تحتفظ بالمشاهد أكثر؟»). كلٌّ منهما لا يعمل إلا إذا تغيّر ملفّه
      #    في الإيداع نفسه: البحث 100 وحدة، فلا يُعاد إنفاقه حين يتغيّر ملفٌّ آخر في ops/stats.
      # ⛔ الشوط 37311286244: النسخة ضحلة فلم يكن origin/master معروفاً ⇒ فشل دفع الدفتر. الجلبُ الآن بمرجعٍ صريح.
      - name: ما الذي تغيّر في هذا الإيداع؟
        id: changed
        run: |
          set -euo pipefail
          F=$(git show --pretty= --name-only "$GITHUB_SHA")
          T=$(echo "$F" | grep -qx 'ops/stats/topics.json' && echo 1 || echo 0)
          C=$(echo "$F" | grep -qx 'ops/stats/competitors.json' && echo 1 || echo 0)
          echo "topics=$T" >> "$GITHUB_OUTPUT"; echo "comp=$C" >> "$GITHUB_OUTPUT"
          echo "البحث: $T | المنافسون: $C"
          # الدفتر من master لا من الفرع: هو مصدر الحقيقة لحصّة اليوم (والإنفاق يُحسب عليه)
          if [ "$T$C" != "00" ]; then
            git fetch -q origin master:refs/remotes/origin/master
            git show origin/master:ops/state/quota_usage.json > ops/state/quota_usage.json
          fi
      - name: الطلب الخارجيّ على الموضوعات المرشّحة
        if: steps.changed.outputs.topics == '1'
        env:
          YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python tools/topic_demand.py out/topic_demand.json
          gh release upload channel-stats out/topic_demand.json --clobber
          echo "✅ رُفع تقرير الطلب الخارجيّ إلى الإصدار المسوّد channel-stats"
      - name: تحليل المنافسين
        if: steps.changed.outputs.comp == '1'
        env:
          YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python tools/competitors.py out/competitors.json
          gh release upload channel-stats out/competitors.json --clobber
          echo "✅ رُفع تحليل المنافسين إلى الإصدار المسوّد channel-stats"
      - name: دفتر الحصص إلى master
        if: steps.changed.outputs.topics == '1' || steps.changed.outputs.comp == '1'
        run: |
          set -euo pipefail
          git config user.name  "مصنع المتفائل"
          git config user.email "factory@mutafail.local"
          cp ops/state/quota_usage.json /tmp/quota_keep.json
          for i in 1 2 3 4; do
            if git fetch -q origin master:refs/remotes/origin/master && git checkout -q -B qsync origin/master; then
              cp /tmp/quota_keep.json ops/state/quota_usage.json
              git add ops/state/quota_usage.json
              if git diff --cached --quiet; then echo "لا جديد"; exit 0; fi
              git commit -qm "📊 دفتر حصّة يوتيوب بعد بحث الطلب وتحليل المنافسين" && git push -q origin HEAD:master && exit 0
            fi
            sleep $(( i * 3 ))
          done
          echo "⛔ تعذّر دفع دفتر الحصص"; exit 1
