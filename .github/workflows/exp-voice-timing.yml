name: تجربة التوقيت وChatterbox
# أمر المالك 2026-11-03: «ابدأ تجربتي التوقيت وChatterbox». تجربةٌ مجّانية على عدّاد GitHub القياسيّ في مستودعٍ عامّ:
# لا fal ولا Gemini ولا نشر. المادّة من فيلم جرجة (الحمولة المختومة وحالة الشوط)، والناتج في إصدار مسوّدة خاصّ
# exp-voice-2026-11-03 لا في المستودع ولا في Artifacts.
on:
  push:
    branches: [claude/project-thread-5fbttc]
    paths: [".github/workflows/exp-voice-timing.yml", "tools/exp/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: exp-voice-timing, cancel-in-progress: true }
env:
  SLUG: jarajah
  TAG: exp-voice-2026-11-03
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  run:
    strategy:
      fail-fast: false
      matrix: { exp: [score] }   # التوقيت اكتمل في 41673495822، وChatterbox في 41678699828
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: الأدوات
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q pillow numpy
          if [ "${{ matrix.exp }}" != chatterbox ]; then pip install -q faster-whisper
          else pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -q chatterbox-tts; fi
      - name: النصوص من الحمولة المختومة، والصوت النظيف من حالة الشوط
        env:
          CONTENT_PRIVATE_KEY: ${{ secrets.CONTENT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # النصوص مختومةٌ بالمفتاح العامّ في ops/exp/jarajah-texts (الحمولة الأصلية تُفكّ بغير هذا المسار)
          cp -r ops/exp/jarajah-texts /tmp/txt && bash tools/unseal.sh /tmp/txt "$PWD/proj" >/dev/null
          bash tools/state_fetch.sh "$SLUG-out" /tmp/st
          tar xzf /tmp/st/state.tgz -C proj --wildcards 'audio/n_*.wav' && rm -f /tmp/st/state.tgz
          echo "كتل: $(python -c "import json;print(len(json.load(open('proj/blocks.json'))))") · صوت: $(ls proj/audio/*.wav | wc -l)"
      - name: التجربة
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ matrix.exp }}" = timing ]; then
            python tools/exp/timing.py proj out/timing.json
          elif [ "${{ matrix.exp }}" = score ]; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p chatterbox.tgz -D /tmp/cb && tar xzf /tmp/cb/chatterbox.tgz -C /tmp/cb
            python tools/exp/asr_score.py proj /tmp/cb/cb out/asr_score.json
          else
            python tools/exp/chatterbox_ar.py proj out/cb n_001,n_005,n_012,n_013,n_040,n_070,n_095,n_105
            ( cd out && tar czf chatterbox.tgz cb && rm -rf cb )
          fi
      - name: الناتج إلى إصدار مسوّدة خاصّ
        if: always()
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "تجربة التوقيت وChatterbox (خاصّة)"
          ls out/* >/dev/null 2>&1 && gh release upload "$TAG" -R "$GITHUB_REPOSITORY" out/* --clobber || echo "لا ناتج"
          rm -rf proj out
