name: فحص حصّة الصوت — بلا توليدٍ يُذكر

run-name: 🔎 ${{ github.event.head_commit.message || 'فحص حصّة الصوت' }}

# افتراض المالك (مؤتة 2026-10-06): «ما استُهلك اليوم جزءٌ من حصّة الأمس، وحصّة اليوم لم تتجدّد».
# يسأل كلّ مفتاحٍ طلباً قصيراً واحداً ويقف عند أوّل نجاح (توليدةٌ واحدة على الأكثر)، ويطبع الحدّ المعلن ومهلة الرفع
# ووقت التجدّد المتوقّع (tools/quota_probe.js). يُطلق بدفع ops/probe/*.json. المستودع عامّ والعدّاء قياسيّ ⇒ مجّانيّ.
on:
  push:
    paths: ["ops/probe/*.json"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: المفاتيح
        env:
          GEMINI_KEYS_JSON: ${{ secrets.GEMINI_KEYS_JSON }}
        run: printf '%s' "$GEMINI_KEYS_JSON" > /tmp/keys.json
      - name: الفحص
        run: |
          # «الكلّ»: true في ملفّ الطلب ⇒ يُسأل كلّ مفتاح ويُقرأ مشروعه من ردّ الرفض (توليدةٌ لكلّ مفتاحٍ متاح)
          ALL=$(python3 -c "import json;print('--all' if json.load(open('ops/probe/tts.json',encoding='utf-8')).get('الكلّ') else '')")
          PROJ=$(python3 -c "import json;print(1 if json.load(open('ops/probe/tts.json',encoding='utf-8')).get('المشاريع') else '')")
          # «المشاريع»: true ⇒ خريطة المشاريع خلف المفاتيح وحدها، بلا أيّ نداءٍ لجيميناي (tools/key_projects.js)
          if [ -n "$PROJ" ]; then node tools/key_projects.js --keys /tmp/keys.json; exit 0; fi
          node tools/quota_probe.js --keys /tmp/keys.json --model gemini-3.8-flash-tts $ALL
