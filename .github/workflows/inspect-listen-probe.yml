name: مصنع المتفائل — تصنيف نتيجة مسبار الفحص

on:
  push:
    branches: [master]
    paths: ["ops/probe/inspect-amal-2.json"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/private-download
        with:
          name: listen-model-probe
          path: probe
          run-id: 35188647783
          github-token: ${{ secrets.GITHUB_TOKEN }}
          private-key: '${{ secrets.CONTENT_PRIVATE_KEY }}'
      - name: صنّف سبب فشل الحكم بلا كشف النص
        run: |
          python3 - <<'PY'
          import glob,json
          rows={}
          for f in glob.glob('probe/listen_results*.json'):
              rows.update(json.load(open(f,encoding='utf-8')))
          if len(rows) != 1: raise SystemExit('⛔ artifact لا يحوي نتيجة واحدة')
          row=next(iter(rows.values())); why=str(row.get('why',''))
          if type(row.get('ok')) is bool: category='valid-verdict'
          elif why.startswith('429:') or why == 'nokeys': category='quota'
          elif why.startswith('404:'): category='model-unavailable'
          elif why.startswith('400:'): category='request-rejected'
          elif 'غير صالح' in why: category='invalid-structured-response'
          elif 'مهلة' in why: category='timeout'
          else: category='unknown-no-verdict'
          print('probe-category=' + category)
          [open('/tmp/probe-category','w').write(category)]
          if category != 'valid-verdict': raise SystemExit('⛔ النموذج البديل غير معتمد: '+category)
          PY
