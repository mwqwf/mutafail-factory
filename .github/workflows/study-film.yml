name: دراسة فيلم — تشخيصٌ مقابل الأقران

# طلب المالك 2026-11-11. تحليلاتٌ خاصّة تُرفع إلى الإصدار المسوّد channel-stats ولا تُودَع.
# الكلفة: العدّاء القياسيّ مجّانيّ في المستودع العامّ، وأسئلة التحليلات لا تمسّ حصّة النشر.
on:
  push:
    paths: ["ops/study-film/*.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 🔑 تفويض يوتيوب
        uses: ./.github/actions/yt-oauth
        with:
          private_key: ${{ secrets.CONTENT_PRIVATE_KEY }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q google-auth google-auth-oauthlib google-api-python-client
      - name: الأسئلة
        env:
          YT_OAUTH_JSON: ${{ env.YT_OAUTH_SEALED_JSON || secrets.YT_OAUTH_JSON }}
        run: |
          set -euo pipefail
          python tools/study_film.py out/study_film.json
          gh release upload channel-stats out/study_film.json --clobber
          # المصغّرات الحيّة كما يراها المشاهد (للمقارنة بالعين)
          for v in 7n_bLN8Bkmk ZSI2NvQp8yc Ah2VnLPpMU0 _OK7JEf9r4s AQW7phGZJUE BEB_BNwleBY; do
            curl -fsSL -o "out/live_thumb_$v.jpg" "https://i.ytimg.com/vi/$v/maxresdefault.jpg" || curl -fsSL -o "out/live_thumb_$v.jpg" "https://i.ytimg.com/vi/$v/hqdefault.jpg" || true
          done
          gh release upload channel-stats out/live_thumb_*.jpg --clobber
