name: جرد القناة وتنظيف العناوين التقنية — 17 سبتمبر
on:
  push:
    branches: [codex/channel-audit-20260917]
    paths: ['tools/channel_audit.mjs', 'ops/audit-public.pem', '.github/workflows/channel-audit.yml', 'ops/channel-title-cleanup.json']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: قراءة القناة وحفظ تقرير مشفر
        env:
          YT_OAUTH_JSON: ${{ secrets.YT_OAUTH_JSON }}
        run: node tools/channel_audit.mjs collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-audit-encrypted
          path: channel-audit.enc.json
          retention-days: 2
