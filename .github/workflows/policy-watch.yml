# مراقبة تحديثات سياسات يوتيوب شهرياً (أمر المالك 2026-10-25: «ادرس كلّ ما قد يعتبرونه مخالفة دورياً»):
# يُنزّل نصّ صفحات السياسات الرسمية ويحفظ لقطةً في ops/policy/snapshots/، فإن تغيّرت عن السابقة أُودع الفرق على master
# مع ملفّ ops/policy/CHANGED.md ليقرأه الفاحص الشهريّ ويحدّث المعجم والوثيقة.
name: 📜 مراقبة سياسات يوتيوب
on:
  schedule:
    - cron: "23 6 1,15 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python tools/policy_watch.py
      - name: إيداع الفرق على master
        run: |
          git config user.name "مصنع المتفائل" && git config user.email "factory@mutafail.local"
          git add -A ops/policy/snapshots ops/policy/CHANGED.md 2>/dev/null || true
          git diff --cached --quiet && { echo "لا تغيّر في السياسات"; exit 0; }
          git commit -qm "📜 تغيّرت صفحات سياسات يوتيوب — تُراجَع البوّابة" && git push -q origin HEAD:master
