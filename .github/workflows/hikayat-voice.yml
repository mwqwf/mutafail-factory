name: صوت الحكايات — توليد وفحص (فرع hikayat فقط)

run-name: 🎙️ ${{ github.event.head_commit.message }}

# قناة الحكايات (UC7owFa1Z0P8vv5tSzhRYfPw) — الفيلم الأوّل «أصحاب الأخدود»، 2026-11-27.
# نموذجٌ واحد للفيلم كلّه: gemini-3.1-flash-tts-preview (حصّته منفصلة عن 3.8 التي يستعملها فيلم التاريخ).
# المخرج: artifact فيه ملفّات wav ونتائج الفحص والإصغاء. لا إيداع ولا إصدار ولا رفع ولا لمس لأيّ قناة يوتيوب.
on:
  push:
    branches: ["hikayat/**"]
    paths: ["ops/hikayat-voice/*.json"]

permissions:
  contents: read
  actions: read

concurrency:
  group: hikayat-voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: بذرة الصوت من أشواطٍ سابقة (لا يُعاد ما وُجد؛ اللاحق يغلب السابق)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          F=$(git show --pretty= --name-only "$GITHUB_SHA" | grep '^ops/hikayat-voice/[^/]*\.json$' | head -1 || true)
          [ -n "$F" ] || exit 0
          mkdir -p seed/audio
          for R in $(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));r=d.get('seed_runs') or ([d['seed_run']] if d.get('seed_run') else []);print(' '.join(map(str,r)))" "$F"); do
            gh run download "$R" -R "$GITHUB_REPOSITORY" -n hikayat-voice -D "s_$R" && cp s_$R/audio/*.wav seed/audio/
          done
          ls seed/audio | wc -l
      - name: الأدوات
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q numpy
      - name: المفاتيح
        env:
          GEMINI_KEYS_JSON: ${{ secrets.GEMINI_KEYS_JSON }}
        run: printf '%s' "$GEMINI_KEYS_JSON" > /tmp/keys.json
      - name: التوليد والفحص والإصغاء
        env:
          GEN_MAX_MIN: "40"
        run: |
          set -uo pipefail
          F=$(git show --pretty= --name-only "$GITHUB_SHA" | grep '^ops/hikayat-voice/[^/]*\.json$' | head -1 || true)
          [ -n "$F" ] || { echo "::notice::لا مواصفة في هذا الإيداع"; exit 0; }
          MODEL=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['model'])" "$F")
          [ "$MODEL" = "gemini-3.1-flash-tts-preview" ] || { echo "::error::النموذج المسموح gemini-3.1-flash-tts-preview وحده"; exit 1; }
          mkdir -p proj
          python3 - "$F" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          only=set(d.get('only') or [])
          b=[x for x in d['blocks'] if not only or x['id'] in only]
          json.dump(b,open('proj/blocks.json','w'),ensure_ascii=False)
          print(len(b),'كتلة')
          PY
          node tools/key_projects.js --keys /tmp/keys.json --files --out /tmp/groups.json || true
          [ -s /tmp/groups.json ] && export GEN_GROUPS=/tmp/groups.json
          mkdir -p proj/audio
          ls seed/audio/*.wav >/dev/null 2>&1 && cp seed/audio/*.wav proj/audio/ && echo "بذرة: $(ls seed/audio | wc -l) كتلة"
          NEED=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(1 if d.get('listen_only') else 0)" "$F")
          if [ "$NEED" = 1 ]; then
            for id in $(python3 -c "import json;print(' '.join(b['id'] for b in json.load(open('proj/blocks.json'))))"); do
              [ -f "proj/audio/$id.wav" ] || { echo "::error::إصغاء فقط: الكتلة $id غائبة من البذرة — لا توليد"; exit 1; }
            done
          fi
          for i in 1 2 3; do
            node tools/gen25.js proj 4 --keys /tmp/keys.json --model "$MODEL" && break || true
          done
          # الفحوص الآلية للتقرير فقط على نسخة (لا حذف: الإلقاء الهادئ أبطأ من حدّ الإيقاع المضبوط على فيلم التاريخ)
          rm -rf chk && mkdir -p chk && cp proj/blocks.json chk/ && cp -r proj/audio chk/audio
          python3 tools/audio_checks.py chk || true
          cp chk/audio_checks.json proj/audio_checks_report.json || true
          LB=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('listen_batch',4))" "$F")
          LMS=$(python3 -c "import json,sys;print(' '.join(json.load(open(sys.argv[1])).get('listen_models',['gemini-3.5-flash'])))" "$F")
          for LM in $LMS; do
            echo "── نموذج الإصغاء: $LM ──"
            node tools/listen.js proj 3 --batch "$LB" --model "$LM" --keys /tmp/keys.json || true
            python3 -c "import json;r=json.load(open('proj/listen_results.json'));print('مفحوص',sum(1 for v in r.values() if v.get('ok') is not None),'من',len(r))" || true
          done
          node tools/adjudicate_listen.js proj --keys /tmp/keys.json --model "${LMS%% *}" || true
          rm -f /tmp/keys.json
          ls proj/audio | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hikayat-voice
          path: |
            proj/audio/*.wav
            proj/*.json
          retention-days: 7
