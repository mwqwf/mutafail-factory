name: مصنع المتفائل — مشغّل الإنتاج اليومي

on:
  schedule:
    - cron: "15 7 * * *"
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: mutafail-controller
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - name: حارس التزامن
        id: busy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" |
              jq -er '[.[].workflow_runs[] | select(.status != "completed") |
              select(.path | test("/(film|resume-listen|finish)\\.yml$"))] | length')
          echo "busy=$N" >> "$GITHUB_OUTPUT"
      - name: اختر أمراً مختوماً جاهزاً
        if: steps.busy.outputs.busy == '0'
        id: ready
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime,glob,json,os,re
          now=datetime.datetime.now(datetime.timezone.utc)
          for f in sorted(glob.glob('ops/ready/*.json')):
              try: d=json.load(open(f,encoding='utf-8'))
              except Exception: continue
              if d.get('تمّ'): continue
              command=d.get('commandDir','')
              if not re.fullmatch(r'ops/commands/[a-z0-9-]+',command): continue
              if not all(os.path.isfile(command+'/'+x) for x in ('payload.enc','key.enc')): continue
              when=d.get('notBefore')
              if when:
                  try: due=datetime.datetime.fromisoformat(when.replace('Z','+00:00'))
                  except Exception: continue
                  if now < due: continue
              print('command_dir='+command); print('ready_file='+f); break
          PY
      - name: أطلق الإنتاج صراحةً
        if: steps.busy.outputs.busy == '0' && steps.ready.outputs.command_dir != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND_DIR: ${{ steps.ready.outputs.command_dir }}
        run: |
          gh workflow run film.yml --repo "$GITHUB_REPOSITORY" --ref master -f command_dir="$COMMAND_DIR"
          echo "قُبل dispatch للأمر المختوم؛ قبول الطلب ليس إثبات اكتمال الإنتاج"
