name: Export amal-4 image prompts securely

on:
  push:
    paths:
      - .github/workflows/export-amal4-prompts.yml

permissions:
  contents: write

concurrency:
  group: export-amal4-prompts
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decrypt checkpoint and re-encrypt only b01-b15 prompts
        env:
          CONTENT_PRIVATE_KEY: ${{ secrets.CONTENT_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/amal4-first"
          OUT="$RUNNER_TEMP/amal4-prompts"
          mkdir -p "$SRC" "$OUT"
          bash tools/unseal.sh ops/pending/amal-4-script-001-045 "$SRC"
          python3 - "$SRC" "$OUT/prompts.txt" <<'PY'
          import pathlib, re, sys
          root, dest = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          wanted = {f'b{i:02d}' for i in range(1, 16)}
          found = {}
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for line in text.splitlines():
                  m = re.match(r'^(IMG:(b(?:0[1-9]|1[0-5]))\|.*)$', line.strip())
                  if m:
                      key = m.group(2)
                      if key in found and found[key] != m.group(1):
                          raise SystemExit(f'conflicting prompt for {key}')
                      found[key] = m.group(1)
          if set(found) != wanted:
              raise SystemExit(f'prompt set mismatch: got {len(found)} of {len(wanted)}')
          dest.write_text('\n'.join(found[f'b{i:02d}'] for i in range(1, 16)) + '\n', encoding='utf-8')
          PY
          cat > "$RUNNER_TEMP/ephemeral.pub" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlq6Yz+GeTSGG5lwMU20C
          Z0QIHnQz9UkwI5E7x0tCCxZFyw83BjN15RmA1lGKVemdydc+JUuOqcaq0o2bB5C5
          j4v4B4WRNE9LpPqhTCCS+OdsB9fWNzN9IoxsIYrEVShY4AFoFcwq2IPDXDtZU6ED
          zEICtcAasvA75IE4VuwSP5XpIq5J6RHz0ld8DGWSFyCXHsRc7ZYAy45J6CFNQuDs
          FLJkGdd0ucFyDoJxnngtvsFlTM0EZ9yiLjbKPP4gpf3jVHRuIY4DzRNlSOM6mEps
          4bFr8OidsmaxedW7Nbip0cI+sZh2TbW0EsrYb3WSfmFButqld5P2MvqbfCUbjsgW
          yQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          tar czf "$RUNNER_TEMP/prompts.tgz" -C "$OUT" prompts.txt
          openssl rand -hex 32 | tr -d '\r\n' > "$RUNNER_TEMP/key.tmp"
          mkdir -p ops/transfer/amal-4-prompts-b01-b15
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/prompts.tgz" \
            -out ops/transfer/amal-4-prompts-b01-b15/payload.enc \
            -pass file:"$RUNNER_TEMP/key.tmp"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/ephemeral.pub" \
            -in "$RUNNER_TEMP/key.tmp" \
            -out ops/transfer/amal-4-prompts-b01-b15/key.enc \
            -pkeyopt rsa_padding_mode:oaep
          base64 -w0 ops/transfer/amal-4-prompts-b01-b15/payload.enc > ops/transfer/amal-4-prompts-b01-b15/payload.enc.b64
          base64 -w0 ops/transfer/amal-4-prompts-b01-b15/key.enc > ops/transfer/amal-4-prompts-b01-b15/key.enc.b64
          rm -rf "$SRC" "$OUT" "$RUNNER_TEMP/prompts.tgz" "$RUNNER_TEMP/key.tmp" "$RUNNER_TEMP/ephemeral.pub"

      - name: Commit encrypted transfer only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -- ops/transfer/amal-4-prompts-b01-b15/payload.enc ops/transfer/amal-4-prompts-b01-b15/key.enc
          git add ops/transfer/amal-4-prompts-b01-b15/payload.enc.b64 ops/transfer/amal-4-prompts-b01-b15/key.enc.b64
          git commit -m "checkpoint: encrypted transfer for amal-4 b01-b15 prompts"
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep $((attempt * 5))
          done
          exit 1
