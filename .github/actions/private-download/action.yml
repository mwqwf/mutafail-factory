name: Private artifact download
description: Authenticate/decrypt artifacts inside the runner before extracting.
inputs:
  name:
    description: Artifact name
    default: ''
  pattern:
    description: Artifact name pattern
    default: ''
  path:
    description: Plaintext destination inside the runner
    required: true
  private-key:
    description: Existing CONTENT_PRIVATE_KEY GitHub secret
    required: true
  run-id:
    description: Source workflow run
    default: ${{ github.run_id }}
  github-token:
    description: Token for cross-run downloads, not a provider key
    default: ''
runs:
  using: composite
  steps:
    - id: stage
      shell: bash
      run: echo "path=$(mktemp -d "$RUNNER_TEMP/mutafail-download.XXXXXX")" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ steps.stage.outputs.path }}
        merge-multiple: false
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
    - shell: bash
      env:
        CONTENT_PRIVATE_KEY: ${{ inputs.private-key }}
        STAGE: ${{ steps.stage.outputs.path }}
        DESTINATION: ${{ inputs.path }}
      run: |
        set -euo pipefail
        umask 077
        count=0
        while IFS= read -r -d '' encrypted; do
          plain="$encrypted.tgz"
          node tools/artifact_crypto.mjs unseal "$encrypted" "$plain"
          if ! python tools/artifact_bundle.py unpack "$plain" "$DESTINATION"; then rm -f "$plain"; exit 1; fi
          rm -f "$plain"
          count=$((count+1))
        done < <(find "$STAGE" -type f -name payload.enc -print0)
        [ "$count" -gt 0 ] || { echo 'No encrypted artifact found; plaintext legacy artifacts are not accepted.'; exit 1; }
