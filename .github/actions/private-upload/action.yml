name: Private artifact upload
description: Encrypt intermediate media before it reaches public-repository artifacts.
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: Paths or globs to encrypt
    required: true
  retention-days:
    description: Existing artifact retention, not a permanent checkpoint
    default: '2'
runs:
  using: composite
  steps:
    - id: pack
      shell: bash
      env:
        ARTIFACT_PATHS: ${{ inputs.path }}
      run: |
        set -euo pipefail
        stage=$(mktemp -d "$RUNNER_TEMP/mutafail-private.XXXXXX")
        echo "stage=$stage" >> "$GITHUB_OUTPUT"
        umask 077
        code=0
        python tools/artifact_bundle.py pack ignored "$stage/archive.tgz" || code=$?
        if [ "$code" = 3 ]; then echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; fi
        [ "$code" = 0 ] || exit "$code"
        node tools/artifact_crypto.mjs seal "$stage/archive.tgz" "$stage/payload.enc" content_public.pem
        echo 'ready=true' >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      if: steps.pack.outputs.ready == 'true'
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.pack.outputs.stage }}/payload.enc
        retention-days: ${{ inputs.retention-days }}
        overwrite: true
        if-no-files-found: error
    - if: always() && steps.pack.outputs.stage != ''
      shell: bash
      env:
        STAGE: ${{ steps.pack.outputs.stage }}
      run: |
        rm -f "$STAGE/archive.tgz" "$STAGE/payload.enc"
        rmdir "$STAGE"
